name: Release

# Publishes a GitHub Release with a ready-to-install APK whenever a version
# tag lands (git tag v1.2.0 && git push --tags). Release notes are generated
# from the commits since the previous tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    name: Build & publish the APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pettrack_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Same pin as CI — pubspec's intl pin follows flutter_localizations.
          flutter-version: "3.44.7"
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build the release APK
        run: flutter build apk --release
      - name: Name the artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk PetTrack.apk
      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: pettrack_app/PetTrack.apk
          body: |
            ### Install
            1. Download `PetTrack.apk` and install it on your phone (allow "install unknown apps" for your browser/file manager).
            2. Start the server — `curl -fsSL https://raw.githubusercontent.com/szbnce/PetTrack/main/setup_server.sh | bash` — and note the 4-digit PIN in the logs.
            3. Open the app, scan the QR code from the server logs, done.
