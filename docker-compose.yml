# The mounts below are files and directories, not a single data folder.
# Docker creates a *missing* host path as a directory, so the first
# `docker compose up` before these exist is the classic way to end up with
# a folder called pettrack.db. The image's entrypoint checks each one and
# tells you what to do; creating them first is quieter:
#
#   mkdir -p pettrack_server/replays pettrack_server/captured_images pettrack_server/updates
#   touch pettrack_server/pettrack.db pettrack_server/.env
#
services:
  pettrack:
    build: .
    container_name: pettrack
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./pettrack_server/replays:/app/replays
      - ./pettrack_server/captured_images:/app/captured_images
      - ./pettrack_server/updates:/app/updates
      - ./pettrack_server/pettrack.db:/app/pettrack.db
      # A directory here is survivable: settings fall back to
      # .env/pettrack.env on the same mount. A file is tidier.
      - ./pettrack_server/.env:/app/.env
